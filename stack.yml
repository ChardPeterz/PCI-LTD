services:
  pci-ltd:
    image: pci-ltd:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATA_DIR: /data
      ADMIN_PASSWORD: "Sativa2026!"
    volumes:
      - pci-stats:/data

volumes:
  pci-stats:
    name: pci-stats
    driver: local